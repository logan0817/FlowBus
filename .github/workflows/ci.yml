name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up consumer JDK 8 and build JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          # tools 已从 SDK 仓库下架；命令行工具由 Action 单独准备。
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-33" "platforms;android-35" "build-tools;35.0.0"

      - name: Check submitted diff whitespace
        run: |
          API_SNAPSHOT_EXCLUDES=(-- . ':(exclude)flowbus-core/api/*.api' ':(exclude)library-android/api/*.api')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}"...HEAD "${API_SNAPSHOT_EXCLUDES[@]}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1..HEAD "${API_SNAPSHOT_EXCLUDES[@]}"
          else
            git diff --check "${API_SNAPSHOT_EXCLUDES[@]}"
          fi

      - name: Run unit tests
        run: ./gradlew :flowbus-core:test :library-android:testDebugUnitTest :app:testDebugUnitTest --rerun-tasks --warning-mode=all

      - name: Check consumer device verification driver
        run: |
          python3 -B compatibility/verify_api35_test.py
          python3 -B -m unittest discover -s compatibility/android-consumer -p '*_test.py' -v
          python3 -B -m unittest discover -s compatibility/compose-consumer -p '*_test.py' -v
          python3 -B -m unittest discover -s compatibility/navigation-consumer -p '*_test.py' -v
          python3 -B -m unittest discover -s compatibility/core-binary-consumer -p '*_test.py' -v
          python3 -B -m unittest discover -s benchmarks/jvm -p '*_test.py' -v

      - name: Check public API compatibility
        run: ./gradlew apiCheck --rerun-tasks --warning-mode=all

      - name: Run core consumer on Java 8
        run: ./gradlew :flowbus-core:verifyCoreRuntime "-Pflowbus.consumer.java=$JAVA_HOME_8_X64/bin/java" -Pflowbus.consumer.expectedJava=1.8 --warning-mode=all

      - name: Run Android release lint
        run: ./gradlew :library-android:lintRelease :app:lintRelease --rerun-tasks --warning-mode=all

      - name: Assemble sample APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --rerun-tasks --warning-mode=all

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            bash compatibility/run-api35.sh

      - name: Verify isolated candidate artifacts and consumers
        run: |
          ./gradlew verifyMavenLocalArtifacts verifyMavenLocalCoreConsumer verifyMavenLocalConsumer verifyMavenLocalComposeConsumer \
            "-Dmaven.repo.local=$PWD/build/candidate-maven" \
            "-Pflowbus.consumer.java=$JAVA_HOME_8_X64/bin/java" -Pflowbus.consumer.expectedJava=1.8 --warning-mode=all

      - name: Check JVM benchmark scenarios and smoke
        run: |
          for benchmark_target in baseline candidate shared; do
            ./gradlew -p benchmarks/jvm selfCheck jmh \
              "-Pbenchmark.target=$benchmark_target" -Pbenchmark.smoke --warning-mode=all
          done

      - name: Verify unchanged 1.0.7 core consumer bytecode
        run: |
          ./gradlew verifyMavenLocalBinaryCoreConsumer \
            "-Dmaven.repo.local=$PWD/build/candidate-maven" \
            "-Pflowbus.consumer.java=$JAVA_HOME_8_X64/bin/java" -Pflowbus.consumer.expectedJava=1.8 --warning-mode=all
          python3 -B compatibility/core-binary-consumer/verify_symbols.py \
            --runtime-report build/maven-local-binary-core-consumer/build/reports/binary-compatibility.json \
            --output build/core-jvm-symbol-verification.json

      - name: Verify unchanged 1.1.0 core consumer bytecode
        run: |
          ./gradlew verifyMavenLocalBinaryCoreConsumer \
            "-Dmaven.repo.local=$PWD/build/candidate-maven" \
            -Pflowbus.consumer.baselineVersion=1.1.0 \
            "-Pflowbus.consumer.java=$JAVA_HOME_8_X64/bin/java" -Pflowbus.consumer.expectedJava=1.8 --warning-mode=all
          python3 -B compatibility/core-binary-consumer/verify_symbols.py \
            --runtime-report build/maven-local-binary-core-consumer-1.1.0/build/reports/binary-compatibility.json \
            --output build/core-1.1.0-jvm-symbol-verification.json

      - name: Verify published Android JVM symbols
        run: |
          mkdir -p build/published-baseline
          curl --fail --location --silent --show-error \
            --output build/published-baseline/flowbus-1.0.7.aar \
            https://repo.maven.apache.org/maven2/io/github/logan0817/flowbus/1.0.7/flowbus-1.0.7.aar
          python3 -c 'import hashlib, pathlib; actual = hashlib.sha256(pathlib.Path("build/published-baseline/flowbus-1.0.7.aar").read_bytes()).hexdigest(); assert actual == "84380a3e456285a77133a4535dd4ff69b2eeb85ee516e3a24326411503ff5592", actual'
          python3 -B compatibility/core-binary-consumer/verify_symbols.py \
            --baseline-artifact build/published-baseline/flowbus-1.0.7.aar \
            --candidate-artifact build/candidate-maven/io/github/logan0817/flowbus/1.2.0/flowbus-1.2.0.aar \
            --baseline-api-snapshot compatibility/android-consumer/api/flowbus-1.0.7.api \
            --output build/android-jvm-symbol-verification.json

      - name: Verify published 1.1.0 Android JVM symbols
        run: |
          curl --fail --location --silent --show-error \
            --output build/published-baseline/flowbus-1.1.0.aar \
            https://repo.maven.apache.org/maven2/io/github/logan0817/flowbus/1.1.0/flowbus-1.1.0.aar
          python3 -c 'import hashlib, pathlib; actual = hashlib.sha256(pathlib.Path("build/published-baseline/flowbus-1.1.0.aar").read_bytes()).hexdigest(); assert actual == "bc7eb2750832da36f49f6be797ea76e922b864093b8ff0d3513b41a3f3450b6a", actual'
          python3 -B compatibility/core-binary-consumer/verify_symbols.py \
            --baseline-artifact build/published-baseline/flowbus-1.1.0.aar \
            --candidate-artifact build/candidate-maven/io/github/logan0817/flowbus/1.2.0/flowbus-1.2.0.aar \
            --baseline-api-snapshot compatibility/android-consumer/api/flowbus-1.1.0.api \
            --output build/android-1.1.0-jvm-symbol-verification.json

      - name: Verify Kotlin consumer compiler matrix
        run: |
          for consumer_kotlin in 1.8.22 1.9.22 2.0.21 2.1.0; do
            ./gradlew verifyMavenLocalCoreConsumer verifyMavenLocalConsumer \
              "-Dmaven.repo.local=$PWD/build/candidate-maven" \
              "-Pflowbus.consumer.kotlinVersion=$consumer_kotlin" \
              "-Pflowbus.consumer.java=$JAVA_HOME_8_X64/bin/java" -Pflowbus.consumer.expectedJava=1.8 --warning-mode=all
          done

      - name: Verify compileSdk 33 consumer
        run: |
          ./gradlew verifyMavenLocalConsumer \
            "-Dmaven.repo.local=$PWD/build/candidate-maven" \
            -Pflowbus.consumer.kotlinVersion=1.8.22 -Pflowbus.consumer.compileSdk=33 --warning-mode=all

      - name: Run library and minified Maven consumer on API 21
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: default
          arch: x86
          disable-animations: true
          script: |
            bash compatibility/run-api21.sh

      - name: Verify newer optional Navigation consumer
        run: |
          ./gradlew verifyMavenLocalComposeConsumer \
            "-Dmaven.repo.local=$PWD/build/candidate-maven" \
            -Pflowbus.consumer.navigationVersion=2.8.3 \
            -Pflowbus.consumer.composeVersion=1.7.8 -Pflowbus.consumer.navHost=true --warning-mode=all

      - name: Verify Maven Central release task graph
        run: |
          ./gradlew verifyCentralDeploymentName --warning-mode=all
          ./gradlew releaseToMavenCentral --dry-run --warning-mode=all

      - name: Preserve verification reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowbus-verification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            flowbus-core/build/test-results/
            library-android/build/test-results/
            app/build/test-results/
            library-android/build/reports/lint-results-release.*
            app/build/reports/lint-results-release.*
            library-android/build/outputs/androidTest-results/
            app/build/outputs/androidTest-results/
            build/maven-local-binary-core-consumer/build/reports/binary-compatibility.json
            build/maven-local-binary-core-consumer-1.1.0/build/reports/binary-compatibility.json
            build/core-1.1.0-jvm-symbol-verification.json
            build/core-jvm-symbol-verification.json
            build/android-jvm-symbol-verification.json
            build/android-1.1.0-jvm-symbol-verification.json
            build/maven-local-consumer/legacy/build/reports/binary-android-compatibility.txt
            build/maven-local-consumer/legacy/build/test-results/
            build/api21-environment/
            build/api35-environment/
            build/android-consumer-device/
            build/compose-effects-device/
            build/compose-policies-device/
            build/navigation-device/
            build/navhost-device/
            benchmarks/jvm/build/reports/
