[versions]
agp = "8.6.1"
kotlin = "1.9.25"
kotlinx_coroutines = "1.8.1"
androidx_test = "1.7.0"
androidx_test_ext = "1.3.0"
espresso_core = "3.7.0"
junit = "4.13.2"
min_sdk_version = "21"
compile_sdk_version = "35"
target_sdk_version = "35"
binary-compatibility-validator = "0.18.1"
vanniktech-maven-publish = "0.33.0"
dokka = "1.9.20"
core_ktx_version = "1.16.0"
appcompat_version = "1.7.1"
activity_version = "1.9.2"
fragment_version = "1.8.3"
lifecycle_version = "2.6.2"
constraint_layout_version = "2.2.1"
flowbus_version = "1.0.7"

[libraries]
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kgp = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx_test_rules = { module = "androidx.test:rules", version.ref = "androidx_test" }
androidx_test_runner = { module = "androidx.test:runner", version.ref = "androidx_test" }
androidx_test_ext_junit = { module = "androidx.test.ext:junit", version.ref = "androidx_test_ext" }
androidx_test_ext_junit_ktx = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx_test_ext" }
espresso_core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso_core" }
androidx_core_ktx = { module = "androidx.core:core-ktx", version.ref = "core_ktx_version" }
androidx_appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat_version" }
androidx_activity = { module = "androidx.activity:activity-ktx", version.ref = "activity_version" }
androidx_fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment_version" }
lifecycle_runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle_version" }
lifecycle_viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle_version" }
lifecycle_livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle_version" }
androidx_constraint_layout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraint_layout_version" }
kotlinx_coroutines_core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx_coroutines" }
kotlinx_coroutines_test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx_coroutines" }
flowbus = { module = "io.github.logan0817:flowbus", version.ref = "flowbus_version" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
